[project]
name = "fifo-ttt-tools"
version = "0.1.0"
description = "Visualization & analysis tools"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.scripts]
fifo-ttt-tools = "fifo_ttt_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fifo_ttt_tools"]
