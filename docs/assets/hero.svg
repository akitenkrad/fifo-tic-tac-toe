<svg width="100%" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">fifo-tic-tac-toe</title>
  <desc id="hero-desc">A FIFO tic-tac-toe board flows into a cyclic state graph, backward win-loss-draw analysis, and a five-by-five results table.</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 32px; font-weight: 650; letter-spacing: -0.5px; fill: #2C2C2A; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #5F5E5A; }
    .stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; fill: #534AB7; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 600; fill: #2C2C2A; }
    .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 9.5px; fill: #5F5E5A; }
    .tiny { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8.5px; font-weight: 700; fill: #5F5E5A; }
    .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 750; fill: #2C2C2A; }
    .mark-x { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 31px; font-weight: 500; fill: #534AB7; }
    .mark-o { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 29px; font-weight: 500; fill: #0F6E56; }
    .panel { fill: #FAF9F6; stroke: #D9D7CF; stroke-width: 0.8; }
    .gray-fill { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
    .purple-fill { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.9; }
    .teal-fill { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.9; }
    .board-line { stroke: #5F5E5A; stroke-width: 1.25; fill: none; }
    .oldest-box { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; stroke-dasharray: 4 3; }
    .oldest-mark { opacity: 0.38; }
    .edge { stroke: #8C8B85; stroke-width: 1.15; fill: none; }
    .cycle { stroke: #0F6E56; stroke-width: 1.55; fill: none; }
    .flow { stroke: #534AB7; stroke-width: 1.7; fill: none; }
    .backflow { stroke: #534AB7; stroke-width: 1.55; fill: none; }
    .backflow-soft { stroke: #8C8B85; stroke-width: 1.1; stroke-dasharray: 4 3; fill: none; }
    .grid { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 0.65; }
    .grid-purple { fill: #CECBF6; stroke: #534AB7; stroke-width: 0.65; }
    .grid-teal { fill: #B7E3D3; stroke: #0F6E56; stroke-width: 0.65; }
    .marker-purple { stroke: #534AB7; }
    .marker-gray { stroke: #8C8B85; }
    .marker-teal { stroke: #0F6E56; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #E5E5E2; }
      .subtitle { fill: #B4B2A9; }
      .stage { fill: #AFA9EC; }
      .label, .node-text { fill: #E5E5E2; }
      .small, .tiny { fill: #B4B2A9; }
      .mark-x { fill: #AFA9EC; }
      .mark-o { fill: #5DCAA5; }
      .panel { fill: #242422; stroke: #5F5E5A; }
      .gray-fill { fill: #3A3A37; stroke: #B4B2A9; }
      .purple-fill { fill: #3C3489; stroke: #AFA9EC; }
      .teal-fill { fill: #085041; stroke: #5DCAA5; }
      .board-line { stroke: #B4B2A9; }
      .oldest-box { fill: #3A3A37; stroke: #B4B2A9; }
      .edge, .backflow-soft { stroke: #73726C; }
      .cycle { stroke: #5DCAA5; }
      .flow, .backflow { stroke: #AFA9EC; }
      .grid { fill: #3A3A37; stroke: #73726C; }
      .grid-purple { fill: #534AB7; stroke: #AFA9EC; }
      .grid-teal { fill: #0F6E56; stroke: #5DCAA5; }
      .marker-purple { stroke: #AFA9EC; }
      .marker-gray { stroke: #73726C; }
      .marker-teal { stroke: #5DCAA5; }
    }
  </style>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="marker-purple" d="M2 1L8 5L2 9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="marker-gray" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="marker-teal" d="M2 1L8 5L2 9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="title" x="52" y="54">fifo-tic-tac-toe</text>
  <text class="subtitle" x="54" y="82">Solving tic-tac-toe where the oldest mark vanishes</text>

  <!-- Four stages -->
  <rect class="panel" x="48" y="108" width="268" height="214" rx="10"/>
  <rect class="panel" x="352" y="108" width="252" height="214" rx="10"/>
  <rect class="panel" x="640" y="108" width="250" height="214" rx="10"/>
  <rect class="panel" x="926" y="108" width="226" height="214" rx="10"/>
  <path class="flow" d="M316 215H344" marker-end="url(#arrow-purple)"/>
  <path class="flow" d="M604 215H632" marker-end="url(#arrow-purple)"/>
  <path class="flow" d="M890 215H918" marker-end="url(#arrow-purple)"/>

  <!-- 1. FIFO board -->
  <text class="stage" x="64" y="132">FIFO BOARD · k = 3</text>
  <g transform="translate(76 150)">
    <rect class="oldest-box" x="0" y="0" width="46" height="46" rx="5"/>
    <path class="board-line" d="M48 0V144M96 0V144M0 48H144M0 96H144"/>
    <g class="oldest-mark">
      <text class="mark-x" x="23" y="34" text-anchor="middle">X</text>
    </g>
    <text class="mark-o" x="72" y="34" text-anchor="middle">O</text>
    <text class="mark-x" x="72" y="82" text-anchor="middle">X</text>
    <text class="mark-o" x="120" y="82" text-anchor="middle">O</text>
    <text class="mark-o" x="24" y="130" text-anchor="middle">O</text>
    <text class="mark-x" x="120" y="130" text-anchor="middle">X</text>
    <circle class="gray-fill" cx="37" cy="9" r="8"/>
    <circle class="purple-fill" cx="86" cy="57" r="8"/>
    <circle class="purple-fill" cx="134" cy="105" r="8"/>
    <text class="tiny" x="37" y="12" text-anchor="middle">1</text>
    <text class="tiny" x="86" y="60" text-anchor="middle">2</text>
    <text class="tiny" x="134" y="108" text-anchor="middle">3</text>
  </g>
  <path class="backflow-soft" d="M117 165C139 145 178 143 205 156" marker-end="url(#arrow-gray)"/>
  <text class="small" x="237" y="168">oldest</text>
  <path class="backflow-soft" d="M235 173H122"/>
  <g transform="translate(236 207)">
    <circle class="gray-fill" cx="8" cy="8" r="8"/>
    <circle class="purple-fill" cx="38" cy="8" r="8"/>
    <circle class="purple-fill" cx="68" cy="8" r="8"/>
    <text class="tiny" x="8" y="11" text-anchor="middle">1</text>
    <text class="tiny" x="38" y="11" text-anchor="middle">2</text>
    <text class="tiny" x="68" y="11" text-anchor="middle">3</text>
    <path class="flow" d="M17 8H27M47 8H57" marker-end="url(#arrow-purple)"/>
    <text class="small" x="38" y="31" text-anchor="middle">X queue</text>
  </g>

  <!-- 2. Finite state graph with a cycle -->
  <text class="stage" x="368" y="132">FINITE STATE GRAPH</text>
  <path class="edge" d="M397 213C414 181 438 166 461 166" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M486 166C513 169 534 185 547 207" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M551 233C536 258 514 272 488 275" marker-end="url(#arrow-gray)"/>
  <path class="cycle" d="M463 275C418 276 390 251 390 226" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M559 232C568 250 569 267 558 282" marker-end="url(#arrow-gray)"/>
  <circle class="purple-fill" cx="390" cy="221" r="17"/>
  <circle class="gray-fill" cx="474" cy="166" r="17"/>
  <circle class="teal-fill" cx="555" cy="220" r="17"/>
  <circle class="gray-fill" cx="474" cy="276" r="17"/>
  <rect class="gray-fill" x="543" y="283" width="28" height="25" rx="6"/>
  <text class="tiny" x="390" y="224" text-anchor="middle">s0</text>
  <text class="tiny" x="474" y="169" text-anchor="middle">s1</text>
  <text class="tiny" x="555" y="223" text-anchor="middle">s2</text>
  <text class="tiny" x="474" y="279" text-anchor="middle">s3</text>
  <text class="tiny" x="557" y="299" text-anchor="middle">T</text>
  <text class="small" x="474" y="303" text-anchor="middle">cycle → endless play</text>

  <!-- 3. Retrograde propagation -->
  <text class="stage" x="656" y="132">RETROGRADE ANALYSIS</text>
  <text class="small" x="765" y="154" text-anchor="middle">propagate backward</text>
  <path class="backflow-soft" d="M704 191H747"/>
  <path class="backflow-soft" d="M783 191H826"/>
  <path class="backflow" d="M826 191H783" marker-end="url(#arrow-purple)"/>
  <path class="backflow" d="M747 191H704" marker-end="url(#arrow-purple)"/>
  <circle class="purple-fill" cx="687" cy="191" r="18"/>
  <circle class="teal-fill" cx="765" cy="191" r="18"/>
  <circle class="gray-fill" cx="843" cy="191" r="18"/>
  <text class="node-text" x="687" y="197" text-anchor="middle">L</text>
  <text class="node-text" x="765" y="197" text-anchor="middle">W</text>
  <text class="node-text" x="843" y="197" text-anchor="middle">L</text>
  <text class="small" x="843" y="222" text-anchor="middle">terminal</text>
  <path class="cycle" d="M737 264C737 236 793 236 793 264C793 292 737 292 737 264" marker-end="url(#arrow-teal)"/>
  <circle class="teal-fill" cx="765" cy="264" r="18"/>
  <text class="node-text" x="765" y="270" text-anchor="middle">D</text>
  <text class="small" x="765" y="307" text-anchor="middle">unresolved cycle = draw</text>

  <!-- 4. k_X by k_O results table -->
  <text class="stage" x="942" y="132">RESULTS · k<tspan baseline-shift="sub" font-size="7">X</tspan> × k<tspan baseline-shift="sub" font-size="7">O</tspan></text>
  <text class="small" x="1115" y="163">k<tspan baseline-shift="sub" font-size="7">O</tspan></text>
  <text class="small" x="949" y="224" text-anchor="middle" transform="rotate(-90 949 224)">k<tspan baseline-shift="sub" font-size="7">X</tspan></text>
  <g transform="translate(986 167)">
    <text class="tiny" x="12" y="-7" text-anchor="middle">1</text>
    <text class="tiny" x="36" y="-7" text-anchor="middle">2</text>
    <text class="tiny" x="60" y="-7" text-anchor="middle">3</text>
    <text class="tiny" x="84" y="-7" text-anchor="middle">4</text>
    <text class="tiny" x="108" y="-7" text-anchor="middle">∞</text>
    <text class="tiny" x="-9" y="16" text-anchor="middle">1</text>
    <text class="tiny" x="-9" y="40" text-anchor="middle">2</text>
    <text class="tiny" x="-9" y="64" text-anchor="middle">3</text>
    <text class="tiny" x="-9" y="88" text-anchor="middle">4</text>
    <text class="tiny" x="-9" y="112" text-anchor="middle">∞</text>
    <rect class="grid" x="0" y="0" width="24" height="24"/>
    <rect class="grid" x="24" y="0" width="24" height="24"/>
    <rect class="grid-purple" x="48" y="0" width="24" height="24"/>
    <rect class="grid-purple" x="72" y="0" width="24" height="24"/>
    <rect class="grid-purple" x="96" y="0" width="24" height="24"/>
    <rect class="grid" x="0" y="24" width="24" height="24"/>
    <rect class="grid" x="24" y="24" width="24" height="24"/>
    <rect class="grid-purple" x="48" y="24" width="24" height="24"/>
    <rect class="grid-purple" x="72" y="24" width="24" height="24"/>
    <rect class="grid-purple" x="96" y="24" width="24" height="24"/>
    <rect class="grid-teal" x="0" y="48" width="24" height="24"/>
    <rect class="grid-teal" x="24" y="48" width="24" height="24"/>
    <rect class="grid-teal" x="48" y="48" width="24" height="24"/>
    <rect class="grid-purple" x="72" y="48" width="24" height="24"/>
    <rect class="grid-purple" x="96" y="48" width="24" height="24"/>
    <rect class="grid-teal" x="0" y="72" width="24" height="24"/>
    <rect class="grid-teal" x="24" y="72" width="24" height="24"/>
    <rect class="grid-teal" x="48" y="72" width="24" height="24"/>
    <rect class="grid-teal" x="72" y="72" width="24" height="24"/>
    <rect class="grid" x="96" y="72" width="24" height="24"/>
    <rect class="grid-teal" x="0" y="96" width="24" height="24"/>
    <rect class="grid-teal" x="24" y="96" width="24" height="24"/>
    <rect class="grid-teal" x="48" y="96" width="24" height="24"/>
    <rect class="grid" x="72" y="96" width="24" height="24"/>
    <rect class="grid" x="96" y="96" width="24" height="24"/>
  </g>
  <g transform="translate(969 302)">
    <rect class="grid-teal" x="0" y="-8" width="10" height="10" rx="2"/>
    <text class="small" x="15" y="0">W</text>
    <rect class="grid-purple" x="45" y="-8" width="10" height="10" rx="2"/>
    <text class="small" x="60" y="0">L</text>
    <rect class="grid" x="88" y="-8" width="10" height="10" rx="2"/>
    <text class="small" x="103" y="0">D</text>
  </g>
</svg>
